<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Contact</title><link rel="stylesheet" href="style.css"></head>
<body>
<header><h2>My Website</h2><button class="menu">☰ Menu</button><nav><a href="index.html">Home</a><a href="about.html">About</a><a href="contact.html">Contact</a></nav><button id="themeButton">Dark / Light</button></header>
<main><h1>Contact Us</h1>
<form id="contactForm" novalidate>
  <label>Name</label><input id="name" type="text" placeholder="Your name"><div class="error" id="nameError"></div>
  <label>Email</label><input id="email" type="text" placeholder="Your email"><div class="error" id="emailError"></div>
  <label>Message</label><textarea id="message" placeholder="Your message"></textarea><div class="error" id="messageError"></div>
  <button type="submit">Submit</button><p class="success" id="success"></p>
</form></main>
<footer>My Website | 2026</footer><script src="common.js"></script><script src="validate.js"></script>
</body></html>
