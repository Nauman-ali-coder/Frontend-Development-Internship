<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Weather App</title><link rel="stylesheet" href="style.css"></head>
<body>
  <main class="container">
    <h1>Weather App</h1>
    <p>Enter a city name to check its current weather.</p>
    <form id="weatherForm"><input id="city" type="text" placeholder="Enter city name" required><button>Search</button></form>
    <p id="status"></p>
    <div id="weather"></div>
    <h3>Last 3 Searches</h3>
    <div id="history"></div>
  </main>
  <script src="script.js"></script>
</body></html>
